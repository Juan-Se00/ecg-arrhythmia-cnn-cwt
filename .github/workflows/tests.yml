name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint configs
        run: python -c "from src.utils.config import load_config; [load_config(f'configs/{f}') for f in ['base.yaml', 'custom_cnn.yaml', 'main_model.yaml', 'control_model.yaml']]"

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing
